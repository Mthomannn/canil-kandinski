<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer subtle circular border -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#shieldBorder)" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="8 6" />

  <!-- Shield Crest Background -->
  <path d="M 256 90 L 380 140 C 380 270 320 370 256 414 C 192 370 132 270 132 140 Z" fill="#1C1917" stroke="url(#gold)" stroke-width="6" />

  <!-- Dog Silhouette & Paw Emblem -->
  <!-- Main Pad -->
  <ellipse cx="256" cy="285" rx="46" ry="36" fill="url(#gold)" />
  <!-- 4 Toes / Paw Pads -->
  <circle cx="205" cy="230" r="18" fill="url(#gold)" />
  <circle cx="238" cy="205" r="18" fill="url(#gold)" />
  <circle cx="274" cy="205" r="18" fill="url(#gold)" />
  <circle cx="307" cy="230" r="18" fill="url(#gold)" />

  <!-- Monogram Crown -->
  <path d="M 216 160 L 256 128 L 296 160 L 284 175 L 228 175 Z" fill="url(#gold)" />
  <circle cx="216" cy="155" r="4" fill="#FDE047" />
  <circle cx="256" cy="123" r="5" fill="#FDE047" />
  <circle cx="296" cy="155" r="4" fill="#FDE047" />

  <!-- Star Embellishments -->
  <polygon points="256,350 260,362 272,362 262,370 266,382 256,374 246,382 250,370 240,362 252,362" fill="url(#gold)" />

  <!-- Brand Typography -->
  <text x="256" y="455" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#FCD34D" text-anchor="middle" letter-spacing="4">KANDINSKI</text>
  <text x="256" y="478" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#A8A29E" text-anchor="middle" letter-spacing="3">CANIL DE LINHAGEM</text>
</svg>
